[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deny-probe"
version = "0.2.0"
description = "Penetration tester for Claude Code permission deny rules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hao Li" }]
keywords = ["claude-code", "security", "permissions", "pentest", "deny-rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
deny-probe = "deny_probe.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/deny-probe"
Repository = "https://github.com/hahahahahahahahah6/deny-probe"

[tool.setuptools.packages.find]
include = ["deny_probe*"]
